apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hog
  name: hog
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hog
  template:
    metadata:
      labels:
        app: hog
    spec:
      containers:
      - image: vish/stress
        imagePullPolicy: Always
        name: stress
        # TODO: Add args: ["--vm", "1", "--vm-bytes", "100M"]
        # TODO: Add resources with requests and limits
        resources: {}
