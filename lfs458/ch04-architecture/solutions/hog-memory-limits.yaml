# Exercise 4.2 step 4 — hog.yaml with MEMORY limits only (no args yet).
# This is the intermediate state before step 9 adds the stress arguments.
# Apply with: kubectl replace -f hog-memory-limits.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hog
  name: hog
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hog
  template:
    metadata:
      labels:
        app: hog
    spec:
      containers:
      - image: vish/stress
        imagePullPolicy: Always
        name: stress
        resources:
          limits:
            memory: "4Gi"
          requests:
            memory: "2500Mi"
