# Exercise 4.3 step 9 — hog2.yaml: same as hog.yaml but deployed into the
# low-usage-limit namespace, to demonstrate that per-deployment resource
# settings override the namespace LimitRange defaults.
# Apply with: kubectl create -f hog2-namespaced.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: hog
  name: hog
  namespace: low-usage-limit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hog
  template:
    metadata:
      labels:
        app: hog
    spec:
      containers:
      - image: vish/stress
        imagePullPolicy: Always
        name: stress
        resources:
          limits:
            cpu: "1"
            memory: "4Gi"
          requests:
            cpu: "0.5"
            memory: "500Mi"
        args:
        - -cpus
        - "2"
        - -mem-total
        - "950Mi"
        - -mem-alloc-size
        - "100Mi"
        - -mem-alloc-sleep
        - "1s"
