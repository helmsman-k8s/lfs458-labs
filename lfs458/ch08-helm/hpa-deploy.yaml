apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hpa-app
  template:
    metadata:
      labels:
        app: hpa-app
    spec:
      containers:
      - name: web
        image: registry.k8s.io/hpa-example
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 5m
          limits:
            cpu: 10m
---
apiVersion: v1
kind: Service
metadata:
  name: hpa-app
spec:
  type: ClusterIP
  selector:
    app: hpa-app
  ports:
  - port: 80
    targetPort: 80
