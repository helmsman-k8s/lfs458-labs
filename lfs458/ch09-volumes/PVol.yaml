apiVersion: v1
kind: PersistentVolume
metadata:
  name: pvvol-1
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Delete
  # TODO: Change persistentVolumeReclaimPolicy to Retain
  nfs:
    path: /opt/sfw
    server: controller
    readOnly: false
