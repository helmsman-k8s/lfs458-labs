# Exercise 10.3 step 13 — CoreDNS ConfigMap with the "rewrite stop" block that
# also rewrites the ANSWER section, so dig returns the test.io name.
#
# Use this ONLY if your own edit broke cluster DNS:
#
#   kubectl apply -f coredns-rewrite-answer.yaml
#   kubectl -n kube-system rollout restart deployment coredns
#
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        rewrite stop {
          name regex (.*)\.test\.io {1}.default.svc.cluster.local
          answer name (.*)\.default\.svc\.cluster\.local {1}.test.io
          }
        errors
        health {
          lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
          ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
          max_concurrent 1000
        }
        cache 30
        loop
        reload
        loadbalance
    }
