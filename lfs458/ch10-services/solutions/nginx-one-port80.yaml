apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-one
  labels:
    app: nginx-one
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx-one
  template:
    metadata:
      labels:
        app: nginx-one
    spec:
      containers:
      - image: nginx:1.20.1
        imagePullPolicy: Always
        name: nginx
        ports:
        - containerPort: 80
          protocol: TCP
