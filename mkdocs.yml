site_name: LFS458 - Kubernetes Administration Lab Guide
site_author: VEGA TRAINING
site_description: Lab exercises for the LFS458 Kubernetes Administration course

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: indigo
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

extra:
  generator: false

copyright: "&copy; 2025 VEGA TRAINING"

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - "Chapter 3: Install Kubernetes": ch03_labs.md
  - "Chapter 4: Architecture": ch04_labs.md
  - "Chapter 5: API Access": ch05_labs.md
  - "Chapter 6: API Objects": ch06_labs.md
  - "Chapter 7: Deployments": ch07_labs.md
  - "Chapter 8: Helm & Kustomize": ch08_labs.md
  - "Chapter 9: Volumes": ch09_labs.md
  - "Chapter 10: Services": ch10_labs.md
  - "Chapter 11: Ingress": ch11_labs.md
  - "Chapter 12: Scheduling": ch12_labs.md
  - "Chapter 13: Troubleshooting": ch13_labs.md
  - "Chapter 14: Custom Resources": ch14_labs.md
  - "Chapter 15: Security": ch15_labs.md
  - "Chapter 16: High Availability": ch16_labs.md



extra_css:
  - stylesheets/pdf.css

plugins:
  - search
  - with-pdf:
      author: VEGA TRAINING
      cover_title: LFS458 - Kubernetes Administration
      cover_subtitle: Lab Guide
      output_path: pdf/lfs458-lab-guide.pdf
